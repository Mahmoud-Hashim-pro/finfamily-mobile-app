plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.finfamily.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.finfamily.app"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    packaging {
        resources {
            excludes += [
                'lib/x86/**',
                'META-INF/**'
            ]
        }
    }

    def keystorePath = System.getenv("KEYSTORE_FILE") ?: System.getenv("KEYSTORE_PATH")
    def keystoreBase64 = System.getenv("KEYSTORE_BASE64")
    if ((keystorePath == null || !file(keystorePath).exists()) && keystoreBase64 != null && !keystoreBase64.trim().isEmpty()) {
        def decodedFile = file("${layout.buildDirectory.get().asFile}/release.keystore")
        decodedFile.parentFile.mkdirs()
        decodedFile.bytes = keystoreBase64.decodeBase64()
        keystorePath = decodedFile.absolutePath
    }
    def hasReleaseKeystore = keystorePath != null && file(keystorePath).exists()

    def isCi = "true".equalsIgnoreCase(System.getenv("CI")) || "true".equalsIgnoreCase(System.getenv("REQUIRE_RELEASE_SIGNING"))
    if (isCi && !hasReleaseKeystore) {
        throw new GradleException("Production release keystore is missing! CI and production release builds must be signed with a valid production keystore.")
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
