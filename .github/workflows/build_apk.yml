name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Flutter CI & Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 (Node 24)
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Ensure Android Project Tooling & Clean State
        run: |
          flutter create --platforms=android --org com.finfamily.app --project-name finfamily_mobile .
          git checkout -- .

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter static analysis
        run: flutter analyze lib --no-fatal-infos

      - name: Run Flutter unit & widget tests
        run: flutter test

      - name: Build Debug Verification APK (Unsigned, No Secrets)
        run: flutter build apk --debug

  release:
    name: Production Release & APK Signing
    needs: [ci]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 (Node 24)
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Ensure Android Project Tooling & Clean State
        run: |
          flutter create --platforms=android --org com.finfamily.app --project-name finfamily_mobile .
          git checkout -- .

      - name: Verify Git Tag Matches Pubspec Version & Extract Metadata
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC_RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '[:space:]')
          PUBSPEC_VER=$(echo "$PUBSPEC_RAW" | cut -d'+' -f1)
          PUBSPEC_BUILD=$(echo "$PUBSPEC_RAW" | cut -d'+' -f2)
          echo "Triggered Tag: $TAG"
          echo "Pubspec Version: $PUBSPEC_VER"
          echo "Pubspec Build Number: $PUBSPEC_BUILD"
          if [ "$TAG" != "$PUBSPEC_VER" ]; then
            echo "ERROR: Git Tag 'v$TAG' does not match pubspec.yaml version '$PUBSPEC_VER'!" >&2
            exit 1
          fi
          if ! echo "$PUBSPEC_BUILD" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: pubspec.yaml build number '$PUBSPEC_BUILD' is missing or not numeric (expected version: X.Y.Z+N)!" >&2
            exit 1
          fi
          # The in-app updater compares against ApiConfig; its defaults must never drift from pubspec.yaml
          CFG_VER=$(grep -o "'APP_VERSION', defaultValue: '[^']*'" lib/config/api_config.dart | sed "s/.*defaultValue: '\([^']*\)'/\1/")
          CFG_BUILD=$(grep -o "'APP_BUILD_NUMBER', defaultValue: [0-9]*" lib/config/api_config.dart | sed 's/.*defaultValue: //')
          if [ "$CFG_VER" != "$PUBSPEC_VER" ] || [ "$CFG_BUILD" != "$PUBSPEC_BUILD" ]; then
            echo "ERROR: ApiConfig defaults ($CFG_VER+$CFG_BUILD) do not match pubspec.yaml ($PUBSPEC_VER+$PUBSPEC_BUILD)!" >&2
            exit 1
          fi
          echo "PUBSPEC_VERSION=$PUBSPEC_VER" >> $GITHUB_ENV
          echo "PUBSPEC_BUILD=$PUBSPEC_BUILD" >> $GITHUB_ENV
          echo "Tag and pubspec.yaml version match verified."

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Production Signing Keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          if [ ! -s "${RUNNER_TEMP}/release.keystore" ]; then
            echo "Error: Decoded keystore is empty!" >&2
            exit 1
          fi
          echo "Production keystore successfully staged for signing."
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI: "true"
        # Bake the real pubspec version into the binary so UpdateChecker never reports a stale version
        run: flutter build apk --release --dart-define=APP_VERSION=${PUBSPEC_VERSION} --dart-define=APP_BUILD_NUMBER=${PUBSPEC_BUILD}

      - name: Clean Keystore File
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Generate SHA256 Checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          echo "Generated SHA256 Checksum:"
          cat app-release.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: FinFamily-App
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: "FinFamily Mobile ${{ github.ref_name }} (Build ${{ env.PUBSPEC_BUILD }})"
          body: |
            FinFamily Mobile ${{ github.ref_name }} (Build ${{ env.PUBSPEC_BUILD }})
            - Official production release signed with FinFamily release certificate.
            - Enhanced Google Sign-In SDK integration with serverClientId and user-friendly error translations.
            - Bilingual in-app and web Privacy Policy and Terms of Service (COPPA & Google OAuth compliant).
            - Dual-persistence session management (secure credentials preserved across app restarts).
            - Centralized multi-family isolation and transaction protection.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
