name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Ensure Android Project Tooling & Clean State
        run: |
          flutter create --platforms=android --org com.finfamily.app --project-name finfamily_mobile .
          git checkout -- .

      - name: Verify Git Tag Matches Pubspec Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "Triggered Tag: $TAG"
          echo "Pubspec Version: $PUBSPEC_VER"
          if [ "$TAG" != "$PUBSPEC_VER" ]; then
            echo "ERROR: Git Tag 'v$TAG' does not match pubspec.yaml version '$PUBSPEC_VER'!" >&2
            exit 1
          fi
          echo "Tag and pubspec.yaml version match verified."

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter static analysis
        run: flutter analyze lib --no-fatal-infos

      - name: Run Flutter unit & widget tests
        run: flutter test

      - name: Decode Production Signing Keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          if [ ! -s "${RUNNER_TEMP}/release.keystore" ]; then
            echo "Error: Decoded keystore is empty!" >&2
            exit 1
          fi
          echo "Production keystore successfully staged for signing."
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI: "true"
        run: flutter build apk --release

      - name: Clean Keystore File
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Generate SHA256 Checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          echo "Generated SHA256 Checksum:"
          cat app-release.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinFamily-App
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Create or Update GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "FinFamily Mobile APK ${{ github.ref_name }}"
          body: |
            FinFamily Mobile ${{ github.ref_name }} (Build 9)
            - Official production release signed with FinFamily release certificate.
            - Enhanced Google Sign-In SDK integration with serverClientId and user-friendly error translations.
            - Bilingual in-app and web Privacy Policy and Terms of Service (COPPA & Google OAuth compliant).
            - Dual-persistence session management (secure credentials preserved across app restarts).
            - Centralized multi-family isolation and transaction protection.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
