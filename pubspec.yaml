name: finfamily_mobile
description: "FinFamily — The First Family Financial Literacy & Smart Meeza Card App for Egypt"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & API
  dio: ^5.7.0
  http: ^1.2.2
  url_launcher: ^6.3.1

  # State Management
  provider: ^6.1.2

  # Secure Storage & Session
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI, Icons & Animations
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  fl_chart: ^0.69.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
